name: Site and evidence checks

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "tests/**"
      - "index.html"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "tests/**"
      - "index.html"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run site and evidence checks
        run: python -m unittest discover -s tests -v
