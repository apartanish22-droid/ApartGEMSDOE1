name: Publish evidence dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh public leaderboard observation
        run: |
          python scripts/update_public_feed.py || echo '::warning::Public feed unavailable; publishing an explicitly unavailable state.'
      # Publish the same root + docs layout as legacy Pages. This preserves
      # /docs/... links whether a push or a scheduled refresh deploys last.
      - name: Assemble consistent Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -a docs _site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
