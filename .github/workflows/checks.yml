name: Evidence and site checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q scripts src
      - run: python -m pytest -q
      - run: python scripts/build_site.py
      - run: git diff --exit-code -- index.html docs run_card.json
      - run: python scripts/verify_release.py --report .cache/release-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: negative-research-release-inspection
          path: .cache/release-ci.json
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-site-browser-inspection
          path: |
            evidence/browser-verification.json
            .cache/browser/*.png
